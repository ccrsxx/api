services:
  api:
    image: ghcr.io/ccrsxx/api:${IMAGE_TAG:-latest}
    container_name: api
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
      - PORT=4000
      - APP_ENV=production
      - DATABASE_URL=postgres://postgres:${DATABASE_PASSWORD}@db:5432/postgres
      # Observability. METRICS_PORT is intentionally NOT published: the Alloy
      # collector scrapes it over the shared 'observability' network.
      - METRICS_PORT=9090
      - OTEL_SERVICE_NAME=api
      - TRACING_ENABLED=${TRACING_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - TRACE_SAMPLE_RATIO=${TRACE_SAMPLE_RATIO:-0.1}
      # Tell the Go runtime about the container memory limit so it GCs harder
      # instead of being OOM-killed. Keep below the limit below.
      - GOMEMLIMIT=450MiB
    deploy:
      resources:
        limits:
          memory: 512M
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - 'no-new-privileges:true'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - observability

  db:
    image: postgres:18.4
    container_name: db
    restart: unless-stopped
    environment:
      - TZ=Asia/Jakarta
      - PGDATA=/data/postgres
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - '5444:5432'
    volumes:
      - db-data:/data/postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  db-backup:
    image: prodrigestivill/postgres-backup-local:18-debian-d257e5d
    container_name: db-backup
    restart: unless-stopped
    environment:
      - TZ=Asia/Jakarta
      - POSTGRES_DB=postgres
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_CLUSTER=true
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    volumes:
      - /backup/database/api:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

networks:
  default:
  # Shared with the LGTM stack so Alloy can scrape api:9090 and the API can
  # reach the collector's OTLP endpoint. Create once: docker network create observability
  observability:
    external: true
